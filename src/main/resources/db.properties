# 数据库驱动配置
# 作用：指定JDBC驱动类名，用于连接MySQL数据库
# 说明：com.mysql.cj.jdbc.Driver是MySQL 8.0及以上版本的驱动类名，旧版本使用com.mysql.jdbc.Driver
jdbc.driver=com.mysql.cj.jdbc.Driver

# 数据库连接URL
# 作用：指定连接到MySQL数据库的URL，包含数据库地址、端口、数据库名和连接参数
# 说明：
# - localhost:3306：数据库服务器地址和端口
# - thesisdb：数据库名
# - useUnicode=true：使用Unicode字符集
# - characterEncoding=utf8：字符编码为UTF-8
# - useSSL=FALSE：不使用SSL连接（开发环境下可以关闭，生产环境建议开启）
# - serverTimezone=UTC：设置服务器时区为UTC
# - allowPublicKeyRetrieval=true：允许从服务器获取公钥
jdbc.url=jdbc:mysql://localhost:3306/thesisdb?useUnicode=true&characterEncoding=utf8&useSSL=FALSE&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 数据库用户名
# 作用：指定连接数据库的用户名
jdbc.username=root

# 数据库密码
# 作用：指定连接数据库的密码
jdbc.password=jiang828